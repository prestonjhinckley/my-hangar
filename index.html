/* Photo identification needs a view that can send images to Claude. Where it can't,
   Claude can still fill in the story from the details typed in. */
function aiMode() {
  if (!S.sample) return "";
  return S.canImages ? "photo" : "text";
}
function updateAI() {
  const sh = S.sheet; const box = $("#sh-ai"); if (!sh || !box) return;
  const mode = aiMode();
  if (!mode && !sh.aiStatus) {
    box.innerHTML = PWA ? `<div class="ai-panel"><span class="label">Identify the aircraft</span><div class="why">Add your Anthropic API key in Profile → AI identification, and Claude can identify the aircraft from your photo.</div></div>` : "";
    return;
  }
  const ready = mode === "photo" ? !!sh.origUrl : !!sh.draft.name.trim();
  const label = mode === "photo" ? (sh.aiInfo ? "Identify again" : "Identify with AI") : "Fill in with AI";
  const intro = mode === "text"
    ? "Photo identification isn't available in this view. Claude can still fill in the empty fields and the history from the aircraft name you type."
    : (sh.origUrl ? "" : "Add a photo first, then Claude can identify the aircraft from its markings.");
  box.innerHTML = `
    <div class="ai-panel">
      <div class="head">
        ${sh.aiPending.size ? `<span class="ai-badge">✦ AI match · confirm</span>` : `<span class="label">${mode === "text" ? "Real aircraft details" : "Identify the aircraft"}</span>`}
        ${mode ? (sh.aiBusy ? `<button type="button" class="btn" id="ai-stop">Stop</button>` : `<button type="button" class="btn green" id="ai-go" ${ready ? "" : "disabled"}>${ICON.spark} ${label}</button>`) : ""}
      </div>
      ${intro && !sh.aiStatus ? `<div class="why">${esc(intro)}</div>` : ""}
      ${sh.aiStatus ? `<div class="why" aria-live="polite">${esc(sh.aiStatus)}</div>` : ""}
      ${Object.keys(sh.aiAlt).length ? `<div class="why">You typed something different from Claude here, so your version was kept. Claude suggests:</div>
        <dl class="rows" style="margin:0">${Object.entries(sh.aiAlt).map(([f, v]) => `<div class="row"><dt>${esc(FIELD_LABELS[f])}</dt><dd>${esc(v.length > 90 ? v.slice(0, 90) + "…" : v)}</dd></div>`).join("")}</dl>
        <button type="button" class="btn" id="ai-alt">Use Claude's version</button>` : ""}
      ${sh.aiPending.size ? `<div class="why">Green fields are Claude's suggestions. Edit any that are wrong, or confirm them all.</div><button type="button" class="btn" id="ai-confirm">Confirm all suggestions</button>` : ""}
    </div>`;
  const ag = $("#ai-go"); if (ag) ag.onclick = runIdentify;
  const as = $("#ai-stop"); if (as) as.onclick = () => sh.aiCtl?.abort();
  const aa = $("#ai-alt"); if (aa) aa.onclick = () => {
    for (const [f, v] of Object.entries(sh.aiAlt)) { setField(f, v, true); sh.touched.delete(f); }
    sh.aiAlt = {}; updateAI(); updateDupes();
  };
  const ac = $("#ai-confirm"); if (ac) ac.onclick = () => {
    for (const f of [...sh.aiPending]) markField(f, false);
    sh.aiPending.clear(); sh.aiStatus = "Suggestions confirmed."; updateAI();
  };
  // the "Fill in with AI" button depends on the name field
  if (mode === "text") {
    const name = $("#f-name");
    if (name && !name.dataset.aiWatch) { name.dataset.aiWatch = "1"; name.addEventListener("input", () => { const b = $("#ai-go"); if (b) b.disabled = !name.value.trim(); }); }
  }
}

function updateDupes() {
  const sh = S.sheet; const box = $("#sh-dupe"); if (!sh || !box) return;
  const dupes = findDuplicates(sh.draft, sh.id);
  box.innerHTML = dupes.length ? `
    <div class="dupe" aria-live="polite">
      <strong>You've built ${dupes.length} of these</strong>
      <div class="dupe-list">${dupes.slice(0, 12).map((m) => `<div class="dupe-item">${stageHTML(m)}<span>${esc(m.name)}${m.unit ? " · " + esc(m.unit) : ""}${m.scale ? " · " + esc(m.scale) : ""}</span></div>`).join("")}</div>
    </div>` : "";
}

function updateSave() {
  const sh = S.sheet; if (!sh) return;
  const can = !!sh.origUrl && !sh.saving && !sh.cutBusy;
  const text = sh.saving ? "Saving…" : sh.existing ? "Save changes" : "Save to My Hangar";
  for (const id of ["sh-save", "sh-save2"]) { const b = document.getElementById(id); if (b) { b.disabled = !can; b.textContent = id === "sh-save" ? (sh.saving ? "Saving…" : "Save") : text; } }
  const c = $("#sh-cancel"); if (c) c.disabled = sh.saving;
  const hint = $("#sh-hint");
  if (hint) hint.textContent = !sh.origUrl ? "Add a photo to save this build." : sh.cutBusy ? "Saving unlocks when the background removal finishes." : "";
}

/* ---------- photo pipeline ---------- */
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = src; });
}
function canvasBlob(c, type, q) { return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), type, q)); }

async function normalizePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const max = 2000;
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return await canvasBlob(c, "image/jpeg", 0.9);
  } finally { URL.revokeObjectURL(url); }
}

async function takePhoto(file) {
  const sh = S.sheet; if (!sh || sh.cutBusy) return;
  sh.cutStatus = "Preparing photo…"; updateCutProgress();
  let blob;
  try { blob = await normalizePhoto(file); }
  catch { if (S.sheet === sh) { sh.cutStatus = "That file couldn't be opened as a photo. Try a JPEG or PNG."; updateCutProgress(); } return; }
  if (S.sheet !== sh) return;
  if (sh.origBlob) URL.revokeObjectURL(sh.origUrl);
  if (sh.cutBlob) URL.revokeObjectURL(sh.cutUrl);
  sh.photoGen++;
  sh.origBlob = blob; sh.origUrl = URL.createObjectURL(blob);
  sh.cutBlob = null; sh.cutUrl = ""; sh.displayMode = "framed";
  sh.cutStatus = ""; sh.aiInfo = null; sh.aiStatus = ""; sh.aiAlt = {};
  updatePhoto(); updateAI(); updateSave();
  if (store.get("autoCutout", true)) runCutout();
}

/* Background removal: ISNet (quantised) running in onnxruntime-web WASM, on this device.
   Files are published next to the page: bg/m00.wasm… (model) and bg/r00.wasm… (onnxruntime 1.21.0 WASM binary), in 4 MB chunks. */
let bgLoading = null;   // Promise<{ort, session}>, shared by every cut-out
let bgProgress = null;  // progress callback of the cut-out currently waiting
function loadBg(onProgress) {
  bgProgress = onProgress;
  if (!bgLoading) bgLoading = loadBgOnce().catch((e) => { bgLoading = null; throw e; });
  return bgLoading;
}
async function loadBgOnce() {
  let ort;
  const ortUrl = PWA ? new URL("vendor/ort.wasm.bundle.min.mjs", document.baseURI).href : `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VER}/dist/ort.wasm.bundle.min.mjs`;
  try { ort = await import(ortUrl); ort = ort.default || ort; }
  catch (e) { throw new Error("runtime-blocked"); }
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.proxy = false;
  let done = 0;
  const total = MODEL_BYTES + RUNTIME_BYTES;
  const fetchChunks = async (prefix, count, size) => {
    const parts = await Promise.all(Array.from({ length: count }, async (_, i) => {
      const r = await fetch(new URL(`bg/${prefix}${String(i).padStart(2, "0")}.wasm`, document.baseURI));
      if (!r.ok) throw new Error("model-missing");
      const b = await r.arrayBuffer();
      done += b.byteLength; bgProgress && bgProgress(done / total);
      return b;
    }));
    const out = new Uint8Array(size);
    let off = 0; for (const p of parts) { out.set(new Uint8Array(p), off); off += p.byteLength; }
    if (off !== size) throw new Error("model-size");
    return out;
  };
  const [runtime, model] = await Promise.all([fetchChunks("r", RUNTIME_CHUNKS, RUNTIME_BYTES), fetchChunks("m", MODEL_CHUNKS, MODEL_BYTES)]);
  ort.env.wasm.wasmBinary = runtime.buffer;
  const session = await ort.InferenceSession.create(model, { executionProviders: ["wasm"], graphOptimizationLevel: "all" });
  return { ort, session };
}

async function cutoutBlob(srcBlob, onProgress) {
  const { ort, session } = await loadBg((p) => onProgress && onProgress("Downloading the cut-out tool (first time only)…", p * 0.9));
  onProgress && onProgress("Removing background…", 0.93);
  await new Promise((r) => setTimeout(r, 40));
  const url = URL.createObjectURL(srcBlob);
  const img = await loadImage(url).finally(() => URL.revokeObjectURL(url));
  const W = img.naturalWidth, H = img.naturalHeight, R = 1024;
  // model input: 1024x1024 stretched, (v-128)/256, NCHW
  const c = document.createElement("canvas"); c.width = R; c.height = R;
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0, R, R);
  const px = cx.getImageData(0, 0, R, R).data;
  const n = R * R, input = new Float32Array(3 * n);
  for (let i = 0, j = 0; j < n; i += 4, j++) {
    input[j] = (px[i] - 128) / 256; input[j + n] = (px[i + 1] - 128) / 256; input[j + 2 * n] = (px[i + 2] - 128) / 256;
  }
  const out = await session.run({ input: new ort.Tensor("float32", input, [1, 3, R, R]) });
  const mask = out.output || out[session.outputNames[0]];
  const md = mask.data;
  // mask -> canvas alpha, then scale to the photo size
  const mc = document.createElement("canvas"); mc.width = R; mc.height = R;
  const mctx = mc.getContext("2d");
  const mImg = mctx.createImageData(R, R);
  let cover = 0;
  for (let j = 0, i = 0; j < n; j++, i += 4) {
    const a = Math.max(0, Math.min(255, Math.round(md[j] * 255)));
    mImg.data[i] = mImg.data[i + 1] = mImg.data[i + 2] = 0; mImg.data[i + 3] = a;
    if (a > 127) cover++;
  }
  mctx.putImageData(mImg, 0, 0);
  const coverage = cover / n;
  if (coverage < 0.01 || coverage > 0.97) throw new Error("no-subject");
  // full-size: photo pixels, masked by alpha (destination-in keeps the photo's own pixels untouched)
  const fc = document.createElement("canvas"); fc.width = W; fc.height = H;
  const fx = fc.getContext("2d", { willReadFrequently: true });
  fx.drawImage(img, 0, 0, W, H);
  fx.globalCompositeOperation = "destination-in";
  fx.imageSmoothingEnabled = true; fx.imageSmoothingQuality = "high";
  fx.drawImage(mc, 0, 0, W, H);
  fx.globalCompositeOperation = "source-over";
  // trim to the subject with a margin
  const ad = fx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    if (ad[(y * W + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) throw new Error("no-subject");
  const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.03);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const tw = x1 - x0 + 1, th = y1 - y0 + 1;
  const tc = document.createElement("canvas"); tc.width = tw; tc.height = th;
  tc.getContext("2d").drawImage(fc, x0, y0, tw, th, 0, 0, tw, th);
  onProgress && onProgress("Removing background…", 1);
  return await canvasBlob(tc, "image/png");
}

async function sourceBlobForSheet(sh) {
  if (sh.origBlob) return sh.origBlob;
  if (sh.existing && sh.existing.originalAssetId) { const r = await fetch(blobUrl(sh.existing.originalAssetId)); if (!r.ok) throw new Error("fetch"); return await r.blob(); }
  throw new Error("no-photo");
}

async function runCutout() {
  const sh = S.sheet; if (!sh || sh.cutBusy) return;
  const gen = sh.photoGen;
  sh.cutBusy = true; sh.cutProgress = 0.02; sh.cutStatus = "Starting…";
  updatePhoto(); updateSave();
  let last = 0;
  try {
    const src = await sourceBlobForSheet(sh);
    const blob = await cutoutBlob(src, (msg, p) => {
      if (S.sheet !== sh) return;
      sh.cutStatus = msg; sh.cutProgress = p;
      const now = Date.now(); if (now - last > 150 || p >= 0.9) { last = now; updateCutProgress(); }
    });
    if (S.sheet !== sh || sh.photoGen !== gen) return;
    if (sh.cutBlob) URL.revokeObjectURL(sh.cutUrl);
    sh.cutBlob = blob; sh.cutUrl = URL.createObjectURL(blob); sh.displayMode = "cutout";
    sh.cutStatus = "Background removed. Your paint job is untouched.";
  } catch (e) {
    if (S.sheet !== sh || sh.photoGen !== gen) return;
    const m = String(e && e.message || e);
    sh.cutStatus = m === "no-subject"
      ? "Couldn't find the model's outline in this photo, so it's shown as photographed."
      : m === "runtime-blocked" || m === "model-missing"
        ? "Background removal isn't available here, so the photo is shown as taken."
        : "Background removal didn't work on this device, so the photo is shown as taken.";
    sh.displayMode = "framed";
    console.warn("cutout failed", e);
  } finally {
    if (S.sheet === sh) { sh.cutBusy = false; updatePhoto(); updateSave(); }
  }
}

/* ---------- AI identify ---------- */
const AI_SHAPE = `Reply with only one JSON object, no other text, in exactly this shape:
{"name": "manufacturer, type and mark, e.g. Supermarine Spitfire Mk Vb",
 "airForce": "e.g. Royal Air Force",
 "unit": "most likely squadron or unit, or empty string if you cannot tell",
 "codes": "unit/individual codes, e.g. RF-D, or empty string",
 "markings": "short label for notable special markings, e.g. Invasion stripes, or empty string",
 "era": "year or short range the markings represent, e.g. 1944",
 "confidence": "high" | "medium" | "low",
 "evidence": "one sentence naming what supports the identification",
 "history": "2 to 3 plain sentences about the real aircraft type and, if known, the unit and the period these markings represent. State facts only; if unsure, keep it general."}`;

async function runIdentify() {
  const sh = S.sheet; const mode = aiMode();
  if (!sh || sh.aiBusy || !mode) return;
  const d = sh.draft;
  if (mode === "text" && !d.name.trim()) { sh.aiStatus = "Type the aircraft name first."; updateAI(); return; }
  sh.aiBusy = true; sh.aiStatus = "Thinking… this usually takes 10 to 40 seconds."; sh.aiCtl = new AbortController();
  updateAI();
  const known = Object.entries({ name: d.name, airForce: d.airForce, unit: d.unit, codes: d.codes, markings: d.markings, era: d.era, kitBrand: d.kitBrand, scale: d.scale })
    .filter(([, v]) => v && v.trim()).map(([k, v]) => `${k}: ${v.trim()}`).join("\n");
  const prompt = mode === "photo"
    ? `The attached photo shows a finished plastic scale model of an aircraft, built and painted by a hobbyist. Identify the REAL aircraft it represents from its shape and the markings painted on the model: squadron codes, serial numbers, roundels or national insignia, unit badges, nose art, invasion stripes and camouflage.

${known ? "The builder has already entered these details (treat as strong hints, correct them only if the photo clearly disagrees):\n" + known + "\n\n" : ""}${AI_SHAPE}`
    : `A hobbyist built a plastic scale model of an aircraft and entered these details:\n${known}\n\nFill in the details of the REAL aircraft and unit these markings represent. Keep the builder's details unless they are clearly inconsistent.\n\n${AI_SHAPE}`;
  try {
    const opts = { signal: sh.aiCtl.signal, cache: false };
    if (mode === "photo") opts.images = await sourceBlobForSheet(sh);
    const r = await S.sample.json(prompt, opts);
    if (S.sheet !== sh) return;
    if (!r || typeof r !== "object") throw { code: "invalid_json" };
    const applied = [];
    sh.aiAlt = {};
    for (const f of AI_FIELDS) {
      const v = typeof r[f] === "string" ? r[f].trim() : "";
      if (!v || norm(v) === norm(d[f])) continue;
      // never overwrite what the builder typed: offer Claude's version instead
      if (!isBlank(d[f]) && (sh.touched.has(f) || mode === "text")) { sh.aiAlt[f] = v; continue; }
      setField(f, v, true); applied.push(f);
    }
    sh.aiInfo = { confidence: String(r.confidence || ""), evidence: String(r.evidence || ""), from: mode, at: new Date().toISOString() };
    const conf = sh.aiInfo.confidence ? `Confidence: ${sh.aiInfo.confidence}. ` : "";
    sh.aiStatus = applied.length || Object.keys(sh.aiAlt).length ? conf + (sh.aiInfo.evidence || "")
      : (r.name ? conf + "Claude's answer matches what's already filled in." : "Claude couldn't identify this one. Fill in the details yourself.");
    updateDupes();
  } catch (e) {
    if (S.sheet !== sh) return;
    const c = e && e.code;
    console.warn("AI failed", e);
    if (c === "cancelled") sh.aiStatus = "Stopped.";
    else if (c === "images_unavailable") { S.canImages = false; sh.aiStatus = "This view can't send photos to Claude. You can still fill in the details from the aircraft name."; }
    else if (c === "not_granted" || c === "sampling_disabled" || c === "capability_disabled" || c === "not_declared") { S.sample = null; sh.aiStatus = "AI isn't available on this account or device."; }
    else if (c === "invalid_json" || c === "empty_completion") sh.aiStatus = "Claude's answer came back garbled. Tap the button to try again.";
    else if (c === "bad_key" || c === "no_key") sh.aiStatus = "Your Anthropic API key was rejected. Check it in Profile → AI identification.";
    else if (c === "offline") sh.aiStatus = "You're offline. Identifying with AI needs an internet connection; everything else works offline.";
    else if (c === "refused") sh.aiStatus = "Claude didn't answer for this photo. Try a different photo.";
    else if (c === "image_rejected") sh.aiStatus = "Claude couldn't read this photo. Try a different one.";
    else sh.aiStatus = errCopy(e, "reach Claude");
    if (c && c !== "cancelled") sh.aiStatus += ` (Reason: ${c})`;
  } finally {
    if (S.sheet === sh) { sh.aiBusy = false; sh.aiCtl = null; updateAI(); }
  }
}

/* ---------- save ---------- */
async function saveSheet() {
  const sh = S.sheet; if (!sh || sh.saving || !sh.origUrl) return;
  if (sh.cutBusy) { toast("Wait for the background removal to finish."); return; }
  sh.saving = true; updateSave();
  const uploaded = [];
  try {
    const prev = sh.existing;
    let originalAssetId = prev?.originalAssetId || null;
    let displayAssetId = prev?.displayAssetId || null;
    if (sh.origBlob) { const u = await S.assets.upload(sh.origBlob, { type: "image/jpeg" }); originalAssetId = u.id; uploaded.push(u.id); }
    if (sh.cutBlob) { const u = await S.assets.upload(sh.cutBlob, { type: "image/png" }); displayAssetId = u.id; uploaded.push(u.id); }
    else if (sh.origBlob) displayAssetId = null; // new photo without a cut-out
    const now = new Date().toISOString();
    const id = sh.id || newId();
    const doc = Object.fromEntries(FIELDS.map((f) => [f, String(sh.draft[f] || "").trim()]));
    Object.assign(doc, {
      originalAssetId, displayAssetId,
      displayMode: displayAssetId && sh.displayMode === "cutout" ? "cutout" : "framed",
      aiPending: [...sh.aiPending],
      ai: sh.aiInfo || null,
      createdAt: prev?.createdAt || now,
      updatedAt: now,
    });
    const ref = S.db.collection("models").doc(id);
    await ref.set(doc);
    // the old photos are no longer referenced once the row points at the new ones
    if (prev) for (const old of [prev.originalAssetId, prev.displayAssetId]) {
      if (old && old !== doc.originalAssetId && old !== doc.displayAssetId) S.assets.delete(old).catch(() => {});
    }
    upsertLocal({ id, ...doc });
    const from = sh.fromKit;
    if (from) {
      S.db.collection(KINDS[from.kind].col).doc(from.id).delete()
        .then(() => { S.kits[from.kind] = S.kits[from.kind].filter((x) => x.id !== from.id); })
        .catch(() => toast("Saved. The kit is still in your " + KINDS[from.kind].title.toLowerCase() + "; remove it there."));
    }
    sh.saving = false;
    closeSheet();
    trackWrite(ref, (snap) => snap.exists && snap.data().updatedAt === now,
      prev ? "Changes saved" : from ? "Added to My Hangar and taken off your " + KINDS[from.kind].title.toLowerCase() : "Added to My Hangar");
    openDetail(id);
  } catch (e) {
    for (const a of uploaded) S.assets.delete(a).catch(() => {});
    if (S.sheet === sh) { sh.saving = false; updateSave(); }
    toast(errCopy(e, "save this build"));
    console.warn("save failed", e);
  }
}

function upsertLocal(m) {
  const i = S.models.findIndex((x) => x.id === m.id);
  if (i >= 0) S.models[i] = m; else S.models.push(m);
  sortModels();
}
function sortModels() { S.models.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || ""))); }

/* ---------- kits: stash + wishlist ----------
   Two lists of kits, one collection each: `stash/{id}` (owned, not built) and `wishlist/{id}`
   (wanted). Same shape: {name, kitBrand, kitNumber, scale, notes, createdAt, updatedAt} plus one
   two-way flag: stash `status` "bench"|"box", wishlist `priority` "must"|"nice".
   A kit moves wishlist → stash ("I bought it") → hangar ("I built it"). Every kit is checked
   against the hangar and the other list with the same duplicate rule as the add form. */
const KINDS = {
  stash: {
    col: "stash", title: "Stash", one: "kit",
    flag: "status", flagOn: "bench", flagOff: "box", flagOnLabel: "On the bench", flagOffLabel: "In the box",
    flagQuestion: "Have you started it?",
    notesLabel: "Notes (where bought, price, extras)",
    where: "In your stash", already: "Already in your stash",
    sheetNew: "Add to stash", sheetEdit: "Stash kit", saveNew: "Add to stash",
    added: "Added to your stash", removeTitle: "Remove this kit from your stash?", removed: "Removed from your stash",
    emptyTitle: "Your stash is empty",
    emptyBody: "Add the kits you own but haven't built yet. Before you buy another, the Search tab checks your stash too.",
  },
  wishlist: {
    col: "wishlist", title: "Wishlist", one: "kit",
    flag: "priority", flagOn: "must", flagOff: "nice", flagOnLabel: "Must have", flagOffLabel: "Nice to have",
    flagQuestion: "How much do you want it?",
    notesLabel: "Notes (shop, price, which version)",
    where: "On your wishlist", already: "Already on your wishlist",
    sheetNew: "Add a kit", sheetEdit: "Wishlist kit", saveNew: "Add to wishlist",
    added: "Added to your wishlist", removeTitle: "Remove this kit from your wishlist?", removed: "Removed from your wishlist",
    emptyTitle: "No kits on your wishlist yet",
    emptyBody: "Add kits you want to buy or build next. Each one shows whether you already built it or have it in your stash.",
  },
};
const otherKind = (kind) => (kind === "stash" ? "wishlist" : "stash");
const kitFlagOn = (kind, k) => k[KINDS[kind].flag] === KINDS[kind].flagOn;

function sortedKits(kind) {
  return S.kits[kind].slice().sort((a, b) =>
    (kitFlagOn(kind, a) ? 0 : 1) - (kitFlagOn(kind, b) ? 0 : 1)
    || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
}
function kitFlagHTML(kind, k) { return kitFlagOn(kind, k) ? ` <span class="pri">${esc(KINDS[kind].flagOnLabel)}</span>` : ""; }

function kitCardHTML(kind, k) {
  const other = otherKind(kind);
  const built = findDuplicates(k, null);
  const elsewhere = findDuplicates(k, null, S.kits[other]);
  const kit = kitLine(k);
  const edit = !!S.assets;
  return `<article class="kit-card">
    <button class="kit-main" data-kit="${kind}:${esc(k.id)}" aria-label="Open ${esc(k.name || "this kit")}">
      <span class="kit-top"><span class="kit-name">${esc(k.name || "Unnamed kit")}</span>${kitFlagHTML(kind, k)}</span>
      ${kit ? `<span class="sub">${esc(kit)}</span>` : ""}
      ${k.notes ? `<span class="sub">${esc(k.notes)}</span>` : ""}
    </button>
    ${built.length ? `<div class="dupe">
      <strong>You've built ${built.length} like this</strong>
      <div class="dupe-list">${built.slice(0, 8).map((m) => `<button class="dupe-item" data-open="${esc(m.id)}">${stageHTML(m)}<span>${esc(m.name)}${m.scale ? " · " + esc(m.scale) : ""}</span></button>`).join("")}</div>
    </div>` : ""}
    ${elsewhere.length ? `<div class="notice">${esc(KINDS[other].already)}: ${elsewhere.map((x) => esc([x.name, kitLine(x)].filter(Boolean).join(", "))).join("; ")}</div>` : ""}
    ${edit ? `<div class="kit-actions">
      ${kind === "wishlist" ? `<button class="btn" data-bought="${esc(k.id)}">${ICON.box} I bought it</button>` : ""}
      <button class="btn green" data-built="${kind}:${esc(k.id)}">${ICON.check} I built it</button>
    </div>` : ""}
  </article>`;
}
function kitResultHTML(kind, k) {
  return `<button class="result text-only" data-kit="${kind}:${esc(k.id)}">
    <span style="min-width:0;display:grid;gap:2px">
      <span class="name">${esc(k.name || "Unnamed kit")}${kitFlagHTML(kind, k)}</span>
      <span class="sub">${esc(kitLine(k) || "No kit details yet")}</span>
    </span>
  </button>`;
}
/* Search-tab sections for both lists: exact text matches, else same-type matches. */
function kitSearchHTML(q) {
  let html = "";
  for (const kind of ["stash", "wishlist"]) {
    const exact = searchModels(q, S.kits[kind]);
    const list = exact.length ? exact : findDuplicates({ name: q, kitNumber: q, kitBrand: "" }, null, S.kits[kind]);
    if (list.length) html += `<h2 class="label section-label">${esc(KINDS[kind].where)}</h2><div class="results">${list.map((k) => kitResultHTML(kind, k)).join("")}</div>`;
  }
  return html;
}

function viewKits() {
  const kind = S.kitTab;
  const K = KINDS[kind];
  const list = S.kits[kind];
  const n = list.length;
  const canEdit = !!S.assets;
  let body;
  if (!S.ready || S.loadError) body = notReadyHTML();
  else if (!n) body = `
    <div class="empty">
      <h2>${esc(K.emptyTitle)}</h2>
      <p>${esc(K.emptyBody)}</p>
      ${canEdit ? `<button class="btn primary" data-act="kit-add">${esc(K.sheetNew)}</button>` : ""}
    </div>`;
  else body = `<div class="kit-grid">${sortedKits(kind).map((k) => kitCardHTML(kind, k)).join("")}</div>`;
  const tabBtn = (k) => `<button type="button" id="kt-${k}" class="${k === kind ? "on" : ""}" aria-pressed="${k === kind}">${KINDS[k].title} <span class="num">(${S.kits[k].length})</span></button>`;
  return `
    <div class="page-head">
      <div><div class="eyebrow">Not built yet</div><h1>Kits</h1></div>
      <div class="count-pill num"><b>${n}</b> ${n === 1 ? "kit" : "kits"}</div>
    </div>
    <div class="seg kit-switch" role="group" aria-label="Which list">${tabBtn("stash")}${tabBtn("wishlist")}</div>
    ${canEdit && n ? `<button class="btn primary block" data-act="kit-add" style="margin-top:12px">${ICON.plus} ${esc(K.sheetNew)}</button>` : ""}
    ${body}`;
}

function findKit(ref) {
  const [kind, id] = String(ref).split(":");
  const k = KINDS[kind] && S.kits[kind].find((x) => x.id === id);
  return k ? { kind, k } : null;
}

function openKit(kind, k) {
  if (!S.db || !S.assetsChecked) { toast("Your hangar is still opening. Try again in a moment."); return; }
  if (!S.assets) { toast("Only the hangar's owner can change these lists."); return; }
  const K = KINDS[kind];
  S.ksheet = {
    kind, id: k ? k.id : null, existing: k || null, touched: false, saving: false,
    draft: { name: k?.name || "", kitBrand: k?.kitBrand || "", kitNumber: k?.kitNumber || "", scale: k?.scale || "", flag: k && k[K.flag] === K.flagOn ? K.flagOn : K.flagOff, notes: k?.notes || "" },
  };
  buildKit();
}
function closeKit() {
  if (!S.ksheet) return;
  S.ksheet = null;
  $("#layer").innerHTML = "";
  document.body.style.overflow = "";
  render();
}
function requestCloseKit() {
  const ks = S.ksheet; if (!ks || ks.saving) return;
  if (!ks.touched) return closeKit();
  showDialog({ title: ks.existing ? "Discard your changes?" : "Discard this kit?", body: "What you entered won't be saved.", yes: "Discard", no: "Keep editing", onYes: closeKit });
}

function buildKit() {
  const ks = S.ksheet; const K = KINDS[ks.kind]; const d = ks.draft;
  const fake = { draft: d, aiPending: new Set() };   // fieldHTML/selectHTML read these
  $("#layer").innerHTML = `
    <div class="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kit-title">
      <div class="sheet-bar">
        <button type="button" class="btn" id="ks-cancel">Cancel</button>
        <h2 id="kit-title">${esc(ks.existing ? K.sheetEdit : K.sheetNew)}</h2>
        <button type="button" class="btn primary" id="ks-save">Save</button>
      </div>
      <form class="sheet-body" id="kit-form" novalidate>
        <fieldset>
          <legend class="label">The kit</legend>
          ${fieldHTML(fake, "name", "Aircraft", 'placeholder="e.g. Spitfire Mk IX" autocomplete="off"')}
          <div id="ks-dupe"></div>
          <div class="two">
            ${selectHTML(fake, "kitBrand", "Kit brand", BRANDS)}
            ${selectHTML(fake, "scale", "Scale", SCALES)}
          </div>
          ${fieldHTML(fake, "kitNumber", "Kit number (optional)", 'placeholder="From the box or the shop listing" autocomplete="off"')}
          <div class="field">
            <span class="field-q">${esc(K.flagQuestion)}</span>
            <div class="seg" role="group" aria-label="${esc(K.flagQuestion)}">
              <button type="button" id="flag-on" class="${d.flag === K.flagOn ? "on" : ""}" aria-pressed="${d.flag === K.flagOn}">${esc(K.flagOnLabel)}</button>
              <button type="button" id="flag-off" class="${d.flag !== K.flagOn ? "on" : ""}" aria-pressed="${d.flag !== K.flagOn}">${esc(K.flagOffLabel)}</button>
            </div>
          </div>
          ${fieldHTML(fake, "notes", K.notesLabel)}
        </fieldset>
        <div class="sheet-foot">
          <button type="submit" class="btn primary block" id="ks-save2">${esc(ks.existing ? "Save changes" : K.saveNew)}</button>
          ${ks.existing ? `
            ${ks.kind === "wishlist" ? `<button type="button" class="btn block" id="ks-bought">${ICON.box} I bought it</button>` : ""}
            <button type="button" class="btn green block" id="ks-built">${ICON.check} I built it</button>
            <button type="button" class="btn danger block" id="ks-delete">${ICON.trash} Remove</button>` : ""}
        </div>
      </form>
    </div>`;
  document.body.style.overflow = "hidden";
  $("#ks-cancel").onclick = requestCloseKit;
  $("#ks-save").onclick = saveKit;
  $("#kit-form").onsubmit = (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.id === "ks-save2") saveKit();
    else if (document.activeElement) document.activeElement.blur(); // Return on the keyboard just closes it
  };
  const setFlag = (v) => {
    d.flag = v; ks.touched = true;
    for (const [id, val] of [["flag-on", K.flagOn], ["flag-off", K.flagOff]]) { const b = $("#" + id); b.classList.toggle("on", v === val); b.setAttribute("aria-pressed", String(v === val)); }
  };
  $("#flag-on").onclick = () => setFlag(K.flagOn);
  $("#flag-off").onclick = () => setFlag(K.flagOff);
  if (ks.existing) {
    const b = $("#ks-bought"); if (b) b.onclick = () => boughtKit(ks.existing);
    $("#ks-built").onclick = () => builtKit(ks.kind, ks.existing);
    $("#ks-delete").onclick = () => confirmDeleteKit(ks.kind, ks.existing);
  }
  let t = null;
  $("#layer").querySelectorAll("[data-f]").forEach((el) => {
    const f = el.dataset.f;
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      d[f] = el.value; ks.touched = true;
      if (f === "name" || f === "kitNumber" || f === "kitBrand") { clearTimeout(t); t = setTimeout(updateKitDupes, 300); }
    });
  });
  updateKitDupes();
}

function updateKitDupes() {
  const ks = S.ksheet; const box = $("#ks-dupe"); if (!ks || !box) return;
  const built = findDuplicates(ks.draft, null);
  const notes = ["stash", "wishlist"].map((kind) => {
    const hits = findDuplicates(ks.draft, kind === ks.kind ? ks.id : null, S.kits[kind]);
    return hits.length ? `<div class="notice" style="margin-top:10px">${esc(KINDS[kind].already)}: ${hits.map((x) => esc([x.name, kitLine(x)].filter(Boolean).join(", "))).join("; ")}</div>` : "";
  }).join("");
  box.innerHTML = (built.length ? `
    <div class="dupe" aria-live="polite">
      <strong>You've built ${built.length} of these</strong>
      <div class="dupe-list">${built.slice(0, 12).map((m) => `<div class="dupe-item">${stageHTML(m)}<span>${esc(m.name)}${m.unit ? " · " + esc(m.unit) : ""}${m.scale ? " · " + esc(m.scale) : ""}</span></div>`).join("")}</div>
    </div>` : "") + notes;
}

function kitDoc(kind, d, existing) {
  const K = KINDS[kind];
  const now = new Date().toISOString();
  return {
    name: d.name.trim(), kitBrand: d.kitBrand, kitNumber: d.kitNumber.trim(), scale: d.scale,
    [K.flag]: d.flag === K.flagOn ? K.flagOn : K.flagOff, notes: d.notes.trim(),
    createdAt: existing?.createdAt || now, updatedAt: now,
  };
}
function upsertKit(kind, k) {
  const list = S.kits[kind];
  const i = list.findIndex((x) => x.id === k.id);
  if (i >= 0) list[i] = k; else list.push(k);
}

async function saveKit() {
  const ks = S.ksheet; if (!ks || ks.saving) return;
  const K = KINDS[ks.kind]; const d = ks.draft;
  if (!d.name.trim() && !d.kitNumber.trim()) { toast("Add the aircraft or a kit number first."); $("#f-name")?.focus(); return; }
  ks.saving = true;
  for (const id of ["ks-save", "ks-save2"]) { const b = $("#" + id); if (b) { b.disabled = true; b.textContent = "Saving…"; } }
  try {
    const id = ks.id || (ks.kind === "stash" ? "s" : "w") + newId().slice(1);
    const doc = kitDoc(ks.kind, d, ks.existing);
    const ref = S.db.collection(K.col).doc(id);
    await ref.set(doc);
    upsertKit(ks.kind, { id, ...doc });
    const wasNew = !ks.existing;
    S.kitTab = ks.kind; store.set("kitTab", ks.kind);
    ks.saving = false;
    closeKit();
    trackWrite(ref, (snap) => snap.exists && snap.data().updatedAt === doc.updatedAt, wasNew ? K.added : "Changes saved");
    if (S.view.name !== "kits" && S.view.name !== "search") go("kits");
  } catch (e) {
    ks.saving = false;
    for (const id of ["ks-save", "ks-save2"]) { const b = $("#" + id); if (b) b.disabled = false; }
    $("#ks-save").textContent = "Save"; $("#ks-save2").textContent = ks.existing ? "Save changes" : K.saveNew;
    toast(errCopy(e, "save this kit"));
  }
}

function dropKitSheet() { if (S.ksheet) { S.ksheet = null; $("#layer").innerHTML = ""; document.body.style.overflow = ""; } }

function confirmDeleteKit(kind, k) {
  const K = KINDS[kind];
  showDialog({
    title: K.removeTitle,
    body: `${k.name || "This kit"} will be taken off the list.`,
    yes: "Remove kit", no: "Keep it",
    onYes: async (b) => {
      b.textContent = "Removing…";
      const ref = S.db.collection(K.col).doc(k.id);
      try { await ref.delete(); }
      catch (e) { b.textContent = "Remove kit"; toast(errCopy(e, "remove this kit")); throw e; }
      S.kits[kind] = S.kits[kind].filter((x) => x.id !== k.id);
      dropKitSheet();
      trackWrite(ref, (snap) => !snap.exists, K.removed);
      render();
    },
  });
}

/* "I bought it": the wishlist kit moves to the stash (written there first, then removed here). */
async function boughtKit(w) {
  dropKitSheet();
  const id = "s" + newId().slice(1);
  const doc = kitDoc("stash", { name: w.name || "", kitBrand: w.kitBrand || "", kitNumber: w.kitNumber || "", scale: w.scale || "", flag: "box", notes: w.notes || "" }, null);
  const ref = S.db.collection("stash").doc(id);
  try { await ref.set(doc); }
  catch (e) { toast(errCopy(e, "move this kit")); return; }
  upsertKit("stash", { id, ...doc });
  try {
    await S.db.collection("wishlist").doc(w.id).delete();
    S.kits.wishlist = S.kits.wishlist.filter((x) => x.id !== w.id);
    trackWrite(ref, (snap) => snap.exists, "Moved to your stash");
  } catch { toast("Added to your stash. It's still on your wishlist; remove it there."); }
  S.kitTab = "stash"; store.set("kitTab", "stash");
  go("kits");
}

/* "I built it": open the add-a-build form with the kit filled in; saving it clears the kit. */
function builtKit(kind, k) {
  dropKitSheet();
  openSheet(null, { prefill: { name: k.name, kitBrand: k.kitBrand, kitNumber: k.kitNumber, scale: k.scale }, fromKit: { kind, id: k.id } });
}

/* ---------- export: spreadsheet (CSV) + catalogue (PDF) ----------
   Both files are made in the browser and handed to the viewer through the `downloads` capability,
   which asks them to confirm the save. The PDF uses jsPDF (cdnjs) and Inter TTFs published next to
   the page (fonts/), so names like "Kościuszko" print correctly. */
const JSPDF_URL = PWA ? "vendor/jspdf.umd.min.js" : "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const todayISO = () => new Date().toISOString().slice(0, 10);
let exporting = false;

function exportCardHTML() {
  if (!S.downloads) return `<p class="muted">Export isn't available in this view.</p>`;
  return `
    <p class="muted" style="font-size:15px">Save a copy of everything: your builds, stash and wishlist.</p>
    <div class="export-btns">
      <button class="btn" id="exp-csv">${ICON.sheet} Spreadsheet (CSV)</button>
      <button class="btn" id="exp-pdf">${ICON.book} Catalogue (PDF)</button>
    </div>
    <div class="status" id="exp-status" aria-live="polite"></div>`;
}
function bindExport() {
  const c = $("#exp-csv"); if (c) c.onclick = exportCSV;
  const p = $("#exp-pdf"); if (p) p.onclick = exportPDF;
}
function exportStatus(msg, p) {
  const el = $("#exp-status"); if (!el) return;
  el.innerHTML = p == null ? esc(msg) : `<span>${esc(msg)}</span><span class="bar"><i style="width:${Math.round(p * 100)}%"></i></span>`;
}
function setExportBusy(on) { for (const id of ["exp-csv", "exp-pdf"]) { const b = document.getElementById(id); if (b) b.disabled = on; } }

async function offerFile(filename, data) {
  try {
    await S.downloads.save({ filename, data });
    exportStatus("Saved " + filename + ".");
  } catch (e) {
    const c = e && e.code;
    exportStatus(c === "declined" ? "Not saved." : c === "rate_limited" ? "A save is already waiting for you to confirm." : "Couldn't save the file here.");
  }
}

/* ---- CSV ---- */
function csvCell(v) {
  let s = String(v ?? "");
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // keep spreadsheet apps from running it as a formula
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
async function exportCSV() {
  if (exporting) return;
  const head = ["List", "Aircraft", "Air force", "Squadron or unit", "Codes", "Special markings", "Era", "Kit brand", "Kit number", "Scale", "Paints", "Date finished", "Status", "Notes", "History of the real aircraft", "Added"];
  const rows = [head];
  for (const m of S.models) rows.push(["Hangar", m.name, m.airForce, m.unit, m.codes, m.markings, m.era, m.kitBrand, realKitNo(m.kitNumber), m.scale, m.paints, m.finishedOn, "Built", m.notes, m.history, (m.createdAt || "").slice(0, 10)]);
  for (const kind of ["stash", "wishlist"]) {
    const K = KINDS[kind];
    for (const k of sortedKits(kind)) rows.push([K.title, k.name, "", "", "", "", "", k.kitBrand, k.kitNumber, k.scale, "", "", kitFlagOn(kind, k) ? K.flagOnLabel : K.flagOffLabel, k.notes, "", (k.createdAt || "").slice(0, 10)]);
  }
  const text = "﻿" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n") + "\r\n"; // BOM: Excel reads it as UTF-8
  exportStatus("Getting the file ready…");
  await offerFile(`my-hangar-${todayISO()}.csv`, text);
}

/* ---- PDF ---- */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script")); document.head.appendChild(s); });
}
async function fontBase64(file) {
  const r = await fetch(new URL("fonts/" + file, document.baseURI)); if (!r.ok) throw new Error("font");
  const bytes = new Uint8Array(await r.arrayBuffer());
  let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function imageFromBlobId(id) {
  if (!id) return null;
  try {
    const r = await fetch(blobUrl(id)); if (!r.ok) return null;
    const url = URL.createObjectURL(await r.blob());
    try { return await loadImage(url); } finally { URL.revokeObjectURL(url); }
  } catch { return null; }
}
/* The display stand, drawn the same way the app draws it: spotlight, floor shadow, model. */
function stageJPEG(img, cut, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(w * 0.5, h * 0.4, 0, w * 0.5, h * 0.4, Math.max(w, h) * 0.62);
  g.addColorStop(0, "#2b313b"); g.addColorStop(0.55, "#161a20"); g.addColorStop(1, "#090a0d");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  if (img) {
    if (cut) {
      const fl = x.createRadialGradient(w / 2, h * 0.885, 0, w / 2, h * 0.885, w * 0.32);
      fl.addColorStop(0, "rgba(0,0,0,.6)"); fl.addColorStop(1, "rgba(0,0,0,0)");
      x.save(); x.translate(0, h * 0.885); x.scale(1, 0.14); x.fillStyle = fl; x.fillRect(0, -h * 3, w, h * 6); x.restore();
      const bw = w * 0.88, bh = h * 0.78, s = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
      const iw = img.naturalWidth * s, ih = img.naturalHeight * s;
      x.save(); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = h * 0.04; x.shadowOffsetY = h * 0.03;
      x.drawImage(img, (w - iw) / 2, h * 0.07 + (bh - ih) / 2, iw, ih); x.restore();
    } else {
      const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      x.drawImage(img, (w - img.naturalWidth * s) / 2, (h - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
      const v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.62);
      v.addColorStop(0, "rgba(9,10,13,0)"); v.addColorStop(1, "rgba(9,10,13,1)");
      x.fillStyle = v; x.fillRect(0, 0, w, h);
    }
  }
  return c.toDataURL("image/jpeg", 0.86);
}
function thumbJPEG(img, size) {
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const x = c.getContext("2d");
  const s = Math.max(size / img.naturalWidth, size / img.naturalHeight);
  x.drawImage(img, (size - img.naturalWidth * s) / 2, (size - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
  return c.toDataURL("image/jpeg", 0.82);
}

async function exportPDF() {
  if (exporting) return;
  exporting = true; setExportBusy(true);
  try {
    exportStatus("Loading the PDF tools…", 0.02);
    if (!window.jspdf) await loadScript(JSPDF_URL);
    const fonts = await Promise.all(["Inter-Regular.ttf", "Inter-SemiBold.ttf", "Inter-ExtraBold.ttf"].map(fontBase64));
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    [["Inter-Regular.ttf", "normal"], ["Inter-SemiBold.ttf", "bold"], ["Inter-ExtraBold.ttf", "heavy"]].forEach(([f, st], i) => {
      doc.addFileToVFS(f, fonts[i]); doc.addFont(f, "Inter", st);
    });
    const W = 612, H = 792, M = 48, CW = W - M * 2;
    const INK = [22, 25, 31], INK2 = [92, 99, 110], INK3 = [140, 146, 156], GOLD = [168, 123, 44], LINE = [222, 225, 230], NIGHT = [13, 15, 19];
    const font = (st, size, col) => { doc.setFont("Inter", st); doc.setFontSize(size); doc.setTextColor(...col); };
    const eyebrow = (t, x, y, col = GOLD) => { font("bold", 8.5, col); doc.setCharSpace(1.4); doc.text(t.toUpperCase(), x, y); doc.setCharSpace(0); };
    const models = S.models;
    const total = models.length;

    // images first, with progress
    const pics = [];
    for (let i = 0; i < total; i++) {
      exportStatus(`Preparing photos (${i + 1} of ${total})…`, 0.05 + 0.75 * (i / Math.max(1, total)));
      const m = models[i];
      const cut = m.displayMode === "cutout" && m.displayAssetId;
      const [disp, orig] = await Promise.all([imageFromBlobId(cut ? m.displayAssetId : m.originalAssetId), cut ? imageFromBlobId(m.originalAssetId) : null]);
      pics.push({ stage: stageJPEG(disp, !!cut, 1400, 840), cover: stageJPEG(disp, !!cut, 480, 360), orig: (orig || disp) ? thumbJPEG(orig || disp, 240) : null });
      await new Promise((r) => setTimeout(r, 0));
    }
    exportStatus("Laying out pages…", 0.85);

    // cover: dark, like the app
    doc.setFillColor(...NIGHT); doc.rect(0, 0, W, H, "F");
    eyebrow("Built & displayed", M, 92, [233, 194, 122]);
    font("heavy", 46, [238, 240, 243]); doc.text("My Hangar", M, 140);
    const stashN = S.kits.stash.length, wishN = S.kits.wishlist.length;
    font("normal", 13, [169, 176, 187]);
    doc.text(`${total} ${total === 1 ? "model" : "models"} built · ${stashN} in the stash · ${wishN} on the wishlist`, M, 166);
    doc.text(`Exported ${new Date().toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}`, M, 184);
    const cols = 3, gap = 12, tw = (CW - gap * (cols - 1)) / cols, th = tw * 0.75;
    pics.slice(0, 12).forEach((p, i) => {
      const cx = M + (i % cols) * (tw + gap), cy = 220 + Math.floor(i / cols) * (th + 30);
      doc.addImage(p.cover, "JPEG", cx, cy, tw, th);
      font("bold", 9, [238, 240, 243]);
      doc.text(doc.splitTextToSize(models[i].name || "Untitled build", tw)[0], cx, cy + th + 14);
    });

    // one page per build
    models.forEach((m, i) => {
      doc.addPage();
      eyebrow("My Hangar", M, 40, INK3);
      font("normal", 9, INK3); doc.text(`${i + 1} of ${total}`, W - M, 40, { align: "right" });
      doc.setDrawColor(...LINE); doc.setLineWidth(0.6); doc.line(M, 48, W - M, 48);
      const sh = CW * 0.6;
      doc.addImage(pics[i].stage, "JPEG", M, 62, CW, sh);
      if (pics[i].orig) {   // the original photo, inset in the corner like the app's "tap to compare"
        doc.setFillColor(255, 255, 255); doc.rect(M + 11, 62 + sh - 73, 62, 62, "F");
        doc.addImage(pics[i].orig, "JPEG", M + 12, 62 + sh - 72, 60, 60);
        font("normal", 7.5, [200, 205, 212]); doc.text("Original photo", M + 80, 62 + sh - 15);
      }
      let y = 62 + sh + 34;
      const eb = [m.airForce, m.era].filter(Boolean).join(" · ");
      if (eb) { eyebrow(eb, M, y); y += 26; }
      font("heavy", 24, INK);
      const title = doc.splitTextToSize(m.name || "Untitled build", CW);
      doc.text(title, M, y); y += title.length * 28;
      if (m.unit) { font("normal", 12.5, INK2); const u = doc.splitTextToSize(m.unit, CW); doc.text(u, M, y - 6); y += u.length * 16; }
      // chips
      const chips = [m.scale, m.codes && "Code " + m.codes, m.markings, yearOf(m.finishedOn) && "Built " + yearOf(m.finishedOn)].filter(Boolean);
      if (chips.length) {
        font("bold", 9.5, INK); let cx = M; y += 4;
        for (const c of chips) {
          const w = doc.getTextWidth(c) + 18;
          if (cx + w > W - M) { cx = M; y += 26; }
          doc.setDrawColor(...LINE); doc.roundedRect(cx, y - 13, w, 20, 5, 5, "S");
          doc.text(c, cx + 9, y + 0.5); cx += w + 6;
        }
        y += 26;
      }
      // two columns: the real aircraft | your build
      const lx = M, lw = CW * 0.56, rx = M + lw + 24, rw = CW - lw - 24;
      const top = y + 6;
      eyebrow("The real aircraft", lx, top, INK3);
      font("normal", 10.5, INK);
      const hist = doc.splitTextToSize(m.history || "No history recorded yet.", lw);
      const maxLines = Math.floor((H - 70 - (top + 18)) / 14.5);
      doc.text(hist.slice(0, maxLines), lx, top + 18, { lineHeightFactor: 1.38 });
      eyebrow("Your build", rx, top, INK3);
      let ry = top + 18;
      for (const [k, v] of [["Kit", kitLine(m)], ["Finished", fmtMonth(m.finishedOn)], ["Paints", m.paints], ["Notes", m.notes]]) {
        if (!v) continue;
        font("normal", 8.5, INK3); doc.text(k, rx, ry);
        font("bold", 10, INK); const lines = doc.splitTextToSize(v, rw).slice(0, 6);
        doc.text(lines, rx, ry + 13, { lineHeightFactor: 1.3 }); ry += 13 + lines.length * 13 + 9;
      }
    });

    // stash + wishlist pages
    for (const kind of ["stash", "wishlist"]) {
      const list = sortedKits(kind); if (!list.length) continue;
      const K = KINDS[kind];
      doc.addPage();
      eyebrow("Not built yet", M, 64);
      font("heavy", 28, INK); doc.text(K.title, M, 98);
      font("normal", 11, INK2); doc.text(`${list.length} ${list.length === 1 ? "kit" : "kits"}`, M, 118);
      let y = 150;
      for (const k of list) {
        const sub = [kitLine(k), kitFlagOn(kind, k) ? K.flagOnLabel : "", k.notes].filter(Boolean).join(" · ");
        const subLines = sub ? doc.splitTextToSize(sub, CW) : [];
        const need = 22 + subLines.length * 13 + 12;
        if (y + need > H - 50) { doc.addPage(); y = 64; }
        font("bold", 12, INK); doc.text(doc.splitTextToSize(k.name || "Unnamed kit", CW)[0], M, y);
        if (subLines.length) { font("normal", 9.5, INK2); doc.text(subLines, M, y + 15); }
        y += need; doc.setDrawColor(...LINE); doc.line(M, y - 10, W - M, y - 10);
      }
    }

    exportStatus("Getting the file ready…", 0.97);
    const blob = doc.output("blob");
    exporting = false;
    await offerFile(`my-hangar-catalogue-${todayISO()}.pdf`, blob);
  } catch (e) {
    console.warn("pdf export failed", e);
    exportStatus(String(e && e.message) === "script" || String(e && e.message) === "font"
      ? "The PDF tools couldn't load. Check your connection and try again."
      : "Couldn't make the PDF. Try again.");
  } finally {
    exporting = false; setExportBusy(false);
  }
}

/* ---------- installed version only: backup + the AI key (window.hangarPlatform) ---------- */
let lastBackupISO = "";
const daysSince = (iso) => Math.floor((Date.now() - Date.parse(iso)) / 864e5);
function backupDue() { return !lastBackupISO || daysSince(lastBackupISO) >= 14; }
function backupAgeText() {
  if (!lastBackupISO) return "No backup saved yet.";
  const d = daysSince(lastBackupISO);
  return "Last backup: " + (d === 0 ? "today." : d === 1 ? "yesterday." : d + " days ago.");
}
function deviceCardsHTML() {
  if (!PWA) return "";
  return `
    <section class="card">
      <h2 class="label">Backup</h2>
      <p class="muted" style="font-size:15px">Your hangar is stored on this phone only. Save a backup file to iCloud Drive or Files now and then, so a lost phone doesn't mean a lost collection.</p>
      <div class="muted" id="bk-when" style="font-size:14px">${esc(backupAgeText())}</div>
      <div class="export-btns">
        <button class="btn primary" id="bk-save">${ICON.box} Save backup</button>
        <label class="btn file-btn">${ICON.image} Restore a backup<input type="file" accept=".zip,application/zip" id="bk-restore" aria-label="Restore a backup"></label>
      </div>
      <div class="status" id="bk-status" aria-live="polite"></div>
    </section>
    <section class="card">
      <h2 class="label">AI identification</h2>
      <div id="ai-key-box" class="muted">Checking…</div>
    </section>`;
}
async function renderKeyBox() {
  const box = $("#ai-key-box"); if (!box) return;
  const P = window.hangarPlatform;
  const has = !!(await P.apiKey());
  if (has) {
    const sp = await P.spend();
    box.innerHTML = `<p style="font-size:15px">Connected. "Identify with AI" sends the photo to Claude (${esc(P.model)}) using your Anthropic API key, which is stored on this phone only.</p>
      <p class="muted num" style="font-size:14px">Spent from this phone: about $${sp.usd.toFixed(2)} over ${sp.calls} ${sp.calls === 1 ? "identification" : "identifications"} (estimate).</p>
      <div class="export-btns"><button class="btn" id="key-remove">Remove key</button></div>`;
    $("#key-remove").onclick = () => showDialog({
      title: "Remove your API key?", body: "AI identification turns off on this phone until you add a key again.", yes: "Remove key", no: "Keep it",
      onYes: async () => { await P.setApiKey(""); S.sample = null; S.canImages = false; toast("Key removed"); renderKeyBox(); },
    });
  } else {
    box.innerHTML = `<p style="font-size:15px">To have Claude identify aircraft from your photos, paste an Anthropic API key. It's stored on this phone only and never leaves it except to talk to Claude. Each identification is charged to that key, usually a few cents.</p>
      <p class="muted" style="font-size:14px">Get a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--gold)">console.anthropic.com</a>.</p>
      <div class="field"><label for="key-input">API key</label><input id="key-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" enterkeyhint="done"></div>
      <div class="export-btns"><button class="btn primary" id="key-save">Save key</button></div>`;
    $("#key-save").onclick = async () => {
      const v = $("#key-input").value.trim();
      if (!/^sk-ant-/.test(v)) { toast("That doesn't look like an Anthropic API key. It starts with sk-ant-."); return; }
      await P.setApiKey(v);
      S.sample = await claude.use("sample");
      S.canImages = !!(await S.sample.limits()).images;
      toast("Key saved. AI identification is on.");
      renderKeyBox();
    };
  }
}
function bindDeviceCards() {
  if (!PWA || !$("#bk-save")) return;
  const P = window.hangarPlatform;
  const st = (m) => { const el = $("#bk-status"); if (el) el.textContent = m; };
  $("#bk-save").onclick = async () => {
    const b = $("#bk-save"); b.disabled = true; st("Packing your hangar…");
    try {
      const r = await P.backup();
      lastBackupISO = await P.lastBackup();
      const w = $("#bk-when"); if (w) w.textContent = backupAgeText();
      const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      st(`Backup ready: ${pl(r.counts[0], "build", "builds")}, ${pl(r.counts[1], "stash kit", "stash kits")}, ${pl(r.counts[2], "wishlist kit", "wishlist kits")}, ${pl(r.photos, "photo", "photos")}.`);
    } catch (e) {
      st(e && e.code === "declined" ? "Backup not saved." : "Couldn't make the backup. Try again.");
    } finally { b.disabled = false; }
  };
  const inp = $("#bk-restore");
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.value = ""; if (!f) return;
    st("Reading the backup…");
    let bk;
    try { bk = await P.readBackup(f); }
    catch { st("That file isn't a My Hangar backup."); return; }
    const d = bk.data, n = (k) => (d[k] || []).length;
    st("");
    showDialog({
      title: "Restore this backup?",
      body: `It has ${n("models")} builds, ${n("stash")} stash kits and ${n("wishlist")} wishlist kits, saved ${new Date(d.exportedAt).toLocaleDateString()}. They're added to this phone; anything with the same ID is replaced. Nothing is deleted.`,
      yes: "Restore", no: "Cancel",
      onYes: async (b) => { b.textContent = "Restoring…"; await P.restoreBackup(bk); toast("Backup restored"); },
    });
  };
  renderKeyBox();
}

/* ---------- confirm dialog (the viewer blocks window.confirm) ---------- */
function closeDialog() { $("#dlg").innerHTML = ""; }
function showDialog({ title, body, yes, no, onYes }) {
  const box = $("#dlg");
  box.innerHTML = `<div class="dialog-backdrop" id="dlg-bg"></div>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
      <h2 id="dlg-t">${esc(title)}</h2>
      <p id="dlg-d">${esc(body)}</p>
      <div class="btns">
        <button class="btn danger block" id="dlg-yes">${esc(yes)}</button>
        <button class="btn block" id="dlg-no">${esc(no)}</button>
      </div>
    </div>`;
  $("#dlg-bg").onclick = closeDialog; $("#dlg-no").onclick = closeDialog;
  $("#dlg-no").focus();
  $("#dlg-yes").onclick = async () => {
    const b = $("#dlg-yes"); b.disabled = true;
    try { await onYes(b); closeDialog(); } catch { b.disabled = false; }
  };
}

/* ---------- delete ---------- */
function confirmDelete(m) {
  showDialog({
    title: "Delete this build?",
    body: `${m.name || "This build"} and its photos will be removed from My Hangar for good.`,
    yes: "Delete build", no: "Keep it",
    onYes: async (b) => {
      b.textContent = "Deleting…";
      const ref = S.db.collection("models").doc(m.id);
      try { await ref.delete(); }
      catch (e) { b.textContent = "Delete build"; toast(errCopy(e, "delete this build")); throw e; }
      for (const a of [m.originalAssetId, m.displayAssetId]) if (a) S.assets.delete(a).catch(() => {});
      S.models = S.models.filter((x) => x.id !== m.id);
      trackWrite(ref, (snap) => !snap.exists, "Build deleted"); go("hangar");
    },
  });
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#dlg").innerHTML) closeDialog();
  else if (S.sheet) requestCloseSheet();
  else if (S.ksheet) requestCloseKit();
});

/* ---------- boot ---------- */
S.kitTab = store.get("kitTab", "stash") === "wishlist" ? "wishlist" : "stash";
render();
(async function boot() {
  if (!window.claude || typeof window.claude.use !== "function") {
    S.loadError = "Open this page on claude.ai to see your hangar. Your builds are stored with the page there.";
    render(); return;
  }
  // Photos and AI load on their own, so a slow capability never holds up the collection.
  claude.use("assets").catch(() => null).then((a) => { S.assets = a; S.assetsChecked = true; if (S.view.name === "detail" && !S.sheet) render(); });
  claude.use("downloads").catch(() => null).then((d) => {
    S.downloads = d;
    const box = $("#export-box"); if (box && !exporting) { box.innerHTML = exportCardHTML(); bindExport(); }
  });
  claude.use("sample").catch(() => null).then(async (sm) => {
    S.sample = sm;
    if (sm) { try { S.canImages = !!(await sm.limits()).images; } catch { S.canImages = false; } }
    if (PWA && !S.canImages) S.sample = null;   // no API key on this device yet
    if (S.sheet) updateAI();
  });
  if (PWA) lastBackupISO = await window.hangarPlatform.lastBackup().catch(() => "");
  const db = await claude.use("db").catch(() => null);
  S.db = db;
  if (!db) { S.loadError = "Sign in to Claude to open your hangar."; render(); return; }
  // Redraw after data changes without disturbing an open form or a focused search box.
  const onDataChange = () => {
    if (S.sheet) updateDupes();
    else if (S.ksheet) updateKitDupes();
    else if ((S.view.name === "hangar" || S.view.name === "search") && document.activeElement && document.activeElement.type === "search") refreshResults();
    else render();
  };
  for (const kind of ["stash", "wishlist"]) {
    db.collection(KINDS[kind].col).onSnapshot((snap) => {
      S.kits[kind] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (S.ready) onDataChange();
    }, () => {});
  }
  db.collection("models").onSnapshot((snap) => {
    S.models = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    sortModels();
    S.ready = true; S.loadError = "";
    onDataChange();
  }, (e) => {
    S.loadError = e && e.code === "revoked" ? "This hangar is no longer available to you." : "Your hangar couldn't load. Reload the page to try again.";
    render();
  });
})();
</script>
